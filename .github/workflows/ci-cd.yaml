name: CI/CD - Docker Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # CI JOB
  # ==========================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Check Docker Hub secrets
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN secret is missing"
            exit 1
          fi

          echo "Docker Hub credentials are available"

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/action-demo-app:latest .

      # 5. Push Docker image
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/action-demo-app:latest


  # ==========================================
  # CD JOB
  # ==========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # CD starts ONLY after CI succeeds
    needs: build-and-push

    steps:

      # 1. Connect to EC2 and deploy
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Starting deployment..."

            echo "Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/action-demo-app:latest

            echo "Stopping old container..."
            docker stop action-demo-container || true

            echo "Removing old container..."
            docker rm action-demo-container || true

            echo "Starting new container..."
            docker run -d \
              --name action-demo-container \
              -p 5000:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/action-demo-app:latest

            echo "Deployment completed!"

            echo "Running containers:"
            docker ps
